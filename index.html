<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Macro Collateral & DeFi Command</title>
  <style>
    :root {
      --bg-app: #0b1120;
      --bg-card: #111827;
      --bg-sub: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --blue: #38bdf8;
      --indigo: #6366f1;
      --amber: #f59e0b;
      --red: #ef4444;
      --green: #10b981;
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.45;
      padding: 16px;
      max-width: 1180px;
      margin: 0 auto;
    }

    /* Top Telemetry Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--blue);
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .main-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    @media (max-width: 720px) {
      .header-right { align-items: flex-start; width: 100%; }
    }

    /* Phase Banner Pill */
    .phase-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .phase-1 { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.45); }
    .phase-2 { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border-color: rgba(239, 68, 68, 0.5); }
    .phase-3 { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.5); }

    /* Cloud Sync Drawer */
    .sync-drawer {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .sync-drawer.open { display: block; }
    .sync-grid {
      display: grid;
      grid-template-columns: 1.4fr 1.4fr auto;
      gap: 10px;
      align-items: end;
    }
    @media (max-width: 820px) { .sync-grid { grid-template-columns: 1fr; } }

    /* 4 KPI Telemetry Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .kpi-grid { grid-template-columns: 1fr; } }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .kpi-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .kpi-val {
      font-size: 1.3rem;
      font-weight: 800;
      font-family: var(--font-mono);
      margin-bottom: 4px;
    }
    .kpi-sub {
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    /* Section Card Wrapper */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .card-title { font-size: 0.98rem; font-weight: 700; color: var(--text-main); }
    .card-subtitle { font-size: 0.78rem; color: var(--text-muted); }

    /* Simulator Sliders */
    .sliders-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 820px) { .sliders-grid { grid-template-columns: 1fr; } }

    .slider-box {
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .slider-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .slider-val { color: var(--blue); font-family: var(--font-mono); font-weight: 700; }
    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
      cursor: pointer;
      height: 22px;
    }

    /* Strategy Pill Selector Bar */
    .strategy-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .strat-btn {
      background: var(--bg-sub);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .strat-btn.active {
      background: rgba(56, 189, 248, 0.18);
      color: var(--blue);
      border-color: var(--blue);
    }

    .qe-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--bg-sub);
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .qe-toggle input { width: 16px; height: 16px; accent-color: var(--green); }

    /* Grouped Horizontal Bar Chart (Actual vs Phase Target) */
    .chart-legend {
      display: flex;
      gap: 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; }
    .swatch-actual { background: var(--blue); }
    .swatch-target { background: #64748b; border: 1px dashed #cbd5e1; }

    .bar-group {
      margin-bottom: 14px;
    }
    .bar-group-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .bar-track {
      position: relative;
      background: #0f172a;
      height: 12px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .bar-fill-actual {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .bar-fill-target {
      height: 100%;
      background: #475569;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* Two-Column Monitor & Directive */
    .dual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
